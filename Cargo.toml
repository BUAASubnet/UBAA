[workspace]
members = [
  "apps/ubaa-cli",
  "crates/ubaa-core",
  "crates/ubaa-test-support",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/BUAASubnet/UBAA"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"


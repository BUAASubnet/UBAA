[workspace]
members = [
  "apps/ubaa_cli",
  "crates/ubaa_core",
  "crates/ubaa_flutter_bridge",
  "crates/ubaa_test_support",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/BUAASubnet/UBAA"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

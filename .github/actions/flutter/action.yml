name: 准备固定 Flutter、Dart 与依赖缓存
description: Flutter 与随附 Dart 按 versions.env 的精确提交安装，Pub 下载按锁文件隔离
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        source scripts/tools/versions.env
        printf 'commit=%s\n' "$FLUTTER_COMMIT" >> "$GITHUB_OUTPUT"
        printf 'PUB_CACHE=%s/pub-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.commit }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/pub-cache
        key: pub-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.commit }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.commit }}-
    - name: 安装并核对锁定的 Flutter 与 Dart
      shell: bash
      run: bash scripts/bootstrap/flutter.sh

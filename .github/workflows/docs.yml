name: 文档构建与发布
on:
  pull_request:
    paths:
      - docs/site/**
      - docs/contracts/app-service.schema.json
      - scripts/check/app_service/content.mjs
      - services/app_service/src/version.mjs
      - .github/actions/**
      - scripts/tools/versions.env
      - package.json
      - package-lock.json
      - .github/workflows/docs.yml
      - services/app_service/package.json
      - services/app_service/package-lock.json
    branches:
      - dev
  push:
    branches:
      - dev
    paths:
      - docs/site/**
      - docs/contracts/app-service.schema.json
      - scripts/check/app_service/content.mjs
      - services/app_service/src/version.mjs
      - .github/actions/**
      - scripts/tools/versions.env
      - package.json
      - package-lock.json
      - .github/workflows/docs.yml
      - services/app_service/package.json
      - services/app_service/package-lock.json
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 构建并检查文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
      - run: npm ci
      - name: 构建网站并检查站内链接
        env:
          DOCS_BASE: /
        run: npm run docs:build
      - name: 保存静态网站
        if: github.event_name != 'pull_request' && github.ref_name == 'dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/site/.vitepress/dist
          if-no-files-found: error
          retention-days: 3
  deploy:
    name: 部署 Cloudflare 文档站
    if: github.event_name != 'pull_request' && github.repository == 'BUAASubnet/UBAA' && github.ref_name == 'dev'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://www.ubaa.top
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: services/app_service/package-lock.json
      - run: npm --prefix services/app_service ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: docs/site/.vitepress/dist
      - id: candidate
        name: 核对发布提交
        shell: bash
        run: |-
          branch_head=$(git ls-remote --exit-code --refs origin "$GITHUB_REF")
          if [[ "${branch_head%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: 部署文档站
        if: steps.candidate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node services/app_service/node_modules/wrangler/bin/wrangler.js deploy --config docs/site/wrangler.json --autoconfig=false

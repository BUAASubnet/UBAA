name: 文档构建与发布
on:
  pull_request:
    paths:
      - docs/site/**
      - docs/contracts/app-service.schema.json
      - scripts/check/app_service/content.mjs
      - services/app_service/src/version.mjs
      - .github/actions/**
      - scripts/tools/versions.env
      - package.json
      - package-lock.json
      - .github/workflows/docs.yml
      - services/app_service/package.json
      - services/app_service/package-lock.json
    branches:
      - dev
  push:
    branches:
      - dev
    paths:
      - docs/site/**
      - docs/contracts/app-service.schema.json
      - scripts/check/app_service/content.mjs
      - services/app_service/src/version.mjs
      - .github/actions/**
      - scripts/tools/versions.env
      - package.json
      - package-lock.json
      - .github/workflows/docs.yml
      - services/app_service/package.json
      - services/app_service/package-lock.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 构建并检查文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
      - run: npm ci
      - name: 构建网站并检查站内链接
        env:
          DOCS_BASE: /
        run: npm run docs:build
      - name: 保存静态网站
        if: github.event_name != 'pull_request' && github.ref_name == 'dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/site/.vitepress/dist
          if-no-files-found: error
          retention-days: 3
  deploy:
    name: 部署服务器文档站
    if: github.event_name != 'pull_request' && github.repository == 'BUAASubnet/UBAA' && github.ref_name == 'dev'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://www.ubaa.top
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 通知服务器直连下载文档站
        env:
          GH_TOKEN: ${{ github.token }}
          UBAA_DEPLOY_KEY: ${{ secrets.UBAA_DEPLOY_KEY }}
          UBAA_DEPLOY_HOST_KEYS: ${{ secrets.UBAA_DEPLOY_HOST_KEYS }}
        run: python3 scripts/server/notify.py docs

name: 文档构建与发布

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [ubaa2, main, dev]
    paths:
      - 'docs/site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并检查文档
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 读取 Pages 配置
        id: pages
        if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH_BRANCH != '' && github.ref_name == vars.DOCS_PUBLISH_BRANCH
        uses: actions/configure-pages@v5
      - name: 构建网站并检查站内链接
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm run docs:build
      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH_BRANCH != '' && github.ref_name == vars.DOCS_PUBLISH_BRANCH
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.vitepress/dist

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH_BRANCH != '' && github.ref_name == vars.DOCS_PUBLISH_BRANCH
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署静态网站
        id: deployment
        uses: actions/deploy-pages@v4

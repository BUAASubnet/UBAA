name: 文档构建与发布

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - '.github/actions/**'
      - 'scripts/tools/versions.env'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [ubaa2, main, dev]
    paths:
      - 'docs/site/**'
      - '.github/actions/**'
      - 'scripts/tools/versions.env'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并检查文档
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
      - run: npm ci
      - name: 读取 Pages 配置
        id: pages
        if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH_BRANCH != '' && github.ref_name == vars.DOCS_PUBLISH_BRANCH
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: 构建网站并检查站内链接
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm run docs:build
      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH_BRANCH != '' && github.ref_name == vars.DOCS_PUBLISH_BRANCH
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs/site/.vitepress/dist

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH_BRANCH != '' && github.ref_name == vars.DOCS_PUBLISH_BRANCH
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署静态网站
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

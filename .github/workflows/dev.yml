name: 开发检查
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dev-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      flutter: ${{ steps.paths.outputs.flutter }}
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check/ci/changes.py
  scripts:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: toolchain
        uses: ./.github/actions/toolchain
      - &setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: |-
            package-lock.json
            services/app_service/package-lock.json
      - uses: ./.github/actions/shellcheck
      - name: 准备工具和冻结引用
        run: |-
          just refs-bootstrap
          just quality-tools-bootstrap
          npm ci --no-audit --no-fund
      - name: 检查脚本、合同和敏感材料
        run: |-
          just refs
          just check-sensitive
          just script-check
          node --test scripts/tests/checks/ci_workflows_test.mjs
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/rust_cache
        with:
          kind: tests
      - name: 检查 Rust 格式、类型和单元测试
        run: |-
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo test --locked -p ubaa-core --features test-contract --lib
  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/toolchain
        with:
          rust: false
      - name: 安装固定 Flutter
        uses: ./.github/actions/flutter
      - name: 检查 Dart 格式和静态分析
        run: bash scripts/check/flutter-workspace.sh analyze

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          rust: false
      - *setup_node
      - name: 检查 Worker 与发布内容
        run: |-
          just app-service-content-check
          just app-service-check
          node --test scripts/tests/app_service/deploy_workflow_test.mjs

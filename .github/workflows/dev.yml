name: 开发检查
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dev-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      flutter: ${{ steps.paths.outputs.flutter }}
      flutter_packages: ${{ steps.paths.outputs.flutter_packages }}
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check/ci/changes.py
  scripts:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: ./.github/actions/toolchain
      - &setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: |-
            package-lock.json
            services/app_service/package-lock.json
      - uses: ./.github/actions/shellcheck
      - name: 准备工具
        run: |-
          just quality-tools-bootstrap
          npm ci --no-audit --no-fund
      - name: 检查脚本、合同和敏感材料
        env:
          UBAA_TEST_TMP: ${{ runner.temp }}/ubaa_test_tmp
        run: |-
          just check-sensitive
          just script-check
          node --test scripts/tests/checks/ci_workflows_test.mjs
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/rust_cache
        with:
          kind: tests
      - name: 检查 Rust 格式、Clippy 和测试
        env:
          UBAA_TEST_TMP: ${{ runner.temp }}/ubaa_test_tmp
        run: |-
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          just core-test-contract
          cargo test --locked --workspace --exclude ubaa-core
  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/toolchain
        with:
          rust: false
      - name: 安装固定 Flutter
        uses: ./.github/actions/flutter
      - name: 检查 Dart 格式和静态分析
        run: bash scripts/check/flutter-workspace.sh analyze
      - name: 测试受影响的 Flutter 包（排除 golden）
        env:
          FLUTTER_PACKAGES: ${{ needs.changes.outputs.flutter_packages }}
          UBAA_TEST_TMP: ${{ runner.temp }}/ubaa_test_tmp
        run: bash scripts/check/flutter-workspace.sh test-non-golden "$FLUTTER_PACKAGES"

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          rust: false
      - *setup_node
      - name: 检查 Worker 与发布内容
        env:
          UBAA_TEST_TMP: ${{ runner.temp }}/ubaa_test_tmp
        run: |-
          just app-service-content-check
          just app-service-check
          node --test scripts/tests/app_service/deploy_workflow_test.mjs

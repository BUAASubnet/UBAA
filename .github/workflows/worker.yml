name: 应用服务部署
on:
  push:
    branches:
      - main
    paths:
      - services/app_service/**
      - scripts/server/**
      - tools/bhpan_publish/**
      - crates/ubaa_core/**
      - Cargo.toml
      - Cargo.lock
      - scripts/check/app_service/**
      - scripts/release/app_service/**
      - scripts/tests/app_service/**
      - scripts/lib/toolchain.py
      - scripts/lib/environment.py
      - docs/contracts/app-service*
      - docs/site/announcements/**
      - package.json
      - package-lock.json
      - .github/workflows/worker.yml
      - .github/actions/**
      - scripts/tools/versions.env
      - justfile
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: app-service-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          rust: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/app_service/package-lock.json
      - name: 校验应用服务发布内容与发布边界
        run: just app-service-content-check
      - name: 检查应用服务合同与 PostgreSQL
        run: just app-service-check
      - name: 构建云盘发布工具
        uses: ./.github/actions/toolchain
      - run: cargo build --locked --release -p ubaa-bhpan-publish
      - name: 打包服务器应用
        run: |
          node scripts/server/package.mjs
          cp target/release/bhpan-publish .ubaa_local/bhpan-publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-service
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .ubaa_local/app_service.tar.gz
            .ubaa_local/bhpan-publish
          retention-days: 3
  app-service-deploy:
    name: 部署应用服务并发布内容
    needs:
      - check
    if: success() && github.event_name == 'push' && github.event.deleted == false && github.repository == 'BUAASubnet/UBAA' && github.ref_name == 'main' || success() && github.event_name == 'workflow_dispatch' && github.repository == 'BUAASubnet/UBAA' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: app-service-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 通知服务器直连下载并部署
        env:
          GH_TOKEN: ${{ github.token }}
          UBAA_DEPLOY_KEY: ${{ secrets.UBAA_DEPLOY_KEY }}
          UBAA_DEPLOY_HOST_KEYS: ${{ secrets.UBAA_DEPLOY_HOST_KEYS }}
        run: python3 scripts/server/notify.py app

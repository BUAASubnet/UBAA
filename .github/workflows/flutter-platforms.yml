name: Flutter 原生平台构建

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/flutter-platforms.yml'
      - 'justfile'
      - 'apps/ubaa_flutter/**'
      - 'apps/ubaa_ohos/**'
      - 'crates/ubaa_core/**'
      - 'crates/ubaa_flutter_bridge/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '!**/*.md'
  push:
    branches: [ubaa2, main, dev]
    paths:
      - '.github/actions/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/flutter-platforms.yml'
      - 'justfile'
      - 'apps/ubaa_flutter/**'
      - 'apps/ubaa_ohos/**'
      - 'crates/ubaa_core/**'
      - 'crates/ubaa_flutter_bridge/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: flutter-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-debug:
    name: ${{ matrix.label }} debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
            platform: linux
            artifact: apps/ubaa_flutter/build/linux/x64/debug/bundle
          - label: Windows
            os: windows-2025
            platform: windows
            artifact: apps/ubaa_flutter/build/windows/x64/runner/Debug
          - label: macOS
            os: macos-15
            platform: macos
            artifact: apps/ubaa_flutter/build/macos/Build/Products/Debug/ubaa_flutter.app
          - label: iOS simulator
            os: macos-15
            platform: ios-simulator
            artifact: apps/ubaa_flutter/build/ios/iphonesimulator/Runner.app
          - label: Android APK
            os: ubuntu-24.04
            platform: android-apk
            artifact: apps/ubaa_flutter/build/app/outputs/flutter-apk/app-debug.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/toolchain

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: 安装 Linux 安全存储运行验证依赖
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y gnome-keyring dbus-x11 xvfb

      - name: 安装固定官方 Flutter SDK
        shell: bash
        run: bash scripts/bootstrap/flutter.sh

      - name: 安装 Android 固定组件
        if: matrix.platform == 'android-apk'
        shell: bash
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          source scripts/tools/versions.env
          # 仅忽略 yes 在 sdkmanager 正常退出后的 SIGPIPE，保留 sdkmanager 的错误。
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" \
            "platforms;android-$ANDROID_API" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: 构建原生宿主
        shell: bash
        env:
          CARGOKIT_VERBOSE: ${{ matrix.platform == 'windows' && '1' || '0' }}
          UBAA_FLUTTER_VERBOSE: ${{ matrix.platform == 'windows' && '1' || '0' }}
        run: just flutter-build platform=${{ matrix.platform }} mode=debug

      - name: 检查无签名产物结构
        shell: bash
        run: bash ./scripts/release/verify-flutter-artifact.sh "${{ matrix.platform }}" "${{ matrix.artifact }}"

      - name: 运行已登记的 macOS 原生能力与 FFI 回归
        if: matrix.platform == 'macos'
        shell: bash
        run: just integration-test

      - name: 验证 Linux 安全存储可用与不可用会话
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/tests/linux-secure-storage.sh

      - name: 关联候选输入与实际产物
        shell: bash
        run: >-
          python3 scripts/release/source_manifest.py
          --output "${{ runner.temp }}/ubaa-build-record"
          --artifact "${{ matrix.artifact }}" --platform "${{ matrix.platform }}"

      - name: 保存构建输入与产物证据
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubaa-${{ matrix.platform }}-build-record-${{ github.run_id }}
          path: ${{ runner.temp }}/ubaa-build-record
          if-no-files-found: error
          retention-days: 14

      - name: 保存可复核产物
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubaa-${{ matrix.platform }}-debug-${{ github.run_id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

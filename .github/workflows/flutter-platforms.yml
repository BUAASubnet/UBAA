name: Flutter 原生平台构建

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ohos_only:
        description: 仅运行 HarmonyOS 托管构建
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-debug:
    if: github.event_name != 'workflow_dispatch' || !inputs.ohos_only
    name: ${{ matrix.label }} debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
            platform: linux
            artifact: apps/ubaa_flutter/build/linux/x64/debug/bundle
          - label: Windows
            os: windows-2025
            platform: windows
            artifact: apps/ubaa_flutter/build/windows/x64/runner/Debug
          - label: macOS
            os: macos-15
            platform: macos
            artifact: apps/ubaa_flutter/build/macos/Build/Products/Debug/ubaa_flutter.app
          - label: iOS simulator
            os: macos-15
            platform: ios-simulator
            artifact: apps/ubaa_flutter/build/ios/iphonesimulator/Runner.app
          - label: Android APK
            os: ubuntu-24.04
            platform: android-apk
            artifact: apps/ubaa_flutter/build/app/outputs/flutter-apk/app-debug.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/toolchain

      - name: 选择 iOS 固定 Xcode
        if: matrix.platform == 'ios-simulator'
        shell: bash
        run: |
          source scripts/tools/versions.env
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_IOS_VERSION}.app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: 安装 Linux 安全存储运行验证依赖
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y gnome-keyring dbus-x11 xvfb

      - name: 安装固定官方 Flutter SDK
        shell: bash
        run: bash scripts/bootstrap/flutter.sh

      - name: 安装 Android 固定组件
        if: matrix.platform == 'android-apk'
        shell: bash
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          source scripts/tools/versions.env
          # 仅忽略 yes 在 sdkmanager 正常退出后的 SIGPIPE，保留 sdkmanager 的错误。
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" \
            "platforms;android-$ANDROID_API" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"

      - name: 缓存 Gradle Wrapper 发行包
        if: matrix.platform == 'android-apk'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('apps/ubaa_flutter/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 准备 Gradle Wrapper
        if: matrix.platform == 'android-apk'
        shell: bash
        working-directory: apps/ubaa_flutter/android
        run: |
          just flutter precache --android
          wrapper="$UBAA_FLUTTER_HOME/bin/cache/artifacts/gradle_wrapper"
          install -m 0755 "$wrapper/gradlew" gradlew
          install -m 0644 "$wrapper/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" == 3 ]]; then
              exit "$status"
            fi
            printf 'Gradle 发行包准备失败，5 秒后重试（%s/3）\n' "$attempt" >&2
            sleep 5
          done

      - name: 构建原生宿主
        shell: bash
        env:
          CARGOKIT_VERBOSE: ${{ matrix.platform == 'windows' && '1' || '0' }}
          UBAA_FLUTTER_VERBOSE: ${{ matrix.platform == 'windows' && '1' || '0' }}
        run: just flutter-build platform=${{ matrix.platform }} mode=debug

      - name: 检查无签名产物结构
        shell: bash
        run: bash ./scripts/release/verify-flutter-artifact.sh "${{ matrix.platform }}" "${{ matrix.artifact }}"

      - name: 运行已登记的 macOS 原生能力与 FFI 回归
        if: matrix.platform == 'macos'
        shell: bash
        run: just integration-test

      - name: 验证 Linux 安全存储可用与不可用会话
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/tests/linux-secure-storage.sh

      - name: 关联候选输入与实际产物
        shell: bash
        run: >-
          python3 scripts/release/build_record.py
          --output "${{ runner.temp }}/ubaa-build-record"
          --artifact "${{ matrix.artifact }}" --platform "${{ matrix.platform }}"

      - name: 保存构建输入与产物证据
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubaa-${{ matrix.platform }}-build-record-${{ github.run_id }}
          path: ${{ runner.temp }}/ubaa-build-record
          if-no-files-found: error
          retention-days: 14

      - name: 保存可复核产物
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubaa-${{ matrix.platform }}-debug-${{ github.run_id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  native-ohos:
    name: HarmonyOS debug
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/toolchain
      - name: 准备 HarmonyOS 托管环境
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libgtk-3-dev libsecret-1-dev ninja-build cmake unzip zip
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          bash scripts/bootstrap/ohos.sh
      - name: 检查并构建 HarmonyOS
        env:
          UBAA_OHOS_NO_CODESIGN: '1'
        run: just ohos-check mode=debug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubaa-ohos-debug-${{ github.run_id }}
          path: apps/ubaa_ohos/build/ohos/hap/*.hap
          if-no-files-found: error
          retention-days: 3

name: Release 构建与草稿
on:
  workflow_dispatch:
    inputs:
      local_macos:
        description: 使用本机专用 runner 执行 Apple 作业及 macOS 验收
        type: boolean
        default: false
      tag:
        description: 草稿 Tag，须与 version.toml 一致；留空使用当前版本
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  metadata:
    if: github.repository == 'BUAASubnet/UBAA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release/metadata.py
  verify:
    needs:
      - metadata
      - store-access
      - acceptance
    uses: ./.github/workflows/ci.yml
    with:
      local_macos: ${{ inputs.local_macos }}
    if: needs.acceptance.outputs.reused != 'true'
  android:
    needs:
      - metadata
      - ready
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 180
    env: &release_env
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_BUILD: ${{ needs.metadata.outputs.build }}
      UBAA_APP_SERVICE_URL: ${{ vars.UBAA_APP_SERVICE_URL }}
      UBAA_DISTRIBUTION_CHANNEL: github
    steps:
      - *checkout
      - &toolchain
        uses: ./.github/actions/toolchain
      - &flutter
        name: 准备固定 Flutter
        uses: ./.github/actions/flutter
      - name: 安装 Android 固定组件
        shell: bash
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          source scripts/tools/versions.env
          # 仅忽略 yes 在 sdkmanager 正常退出后的 SIGPIPE，保留 sdkmanager 的错误。
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" \
            "platforms;android-$ANDROID_API" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK" \
            "cmake;$ANDROID_CMAKE"
      - name: 缓存 Gradle Wrapper 发行包
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('apps/ubaa_flutter/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: 准备 Gradle Wrapper
        shell: bash
        working-directory: apps/ubaa_flutter/android
        run: |
          just flutter precache --android
          wrapper="$UBAA_FLUTTER_HOME/bin/cache/artifacts/gradle_wrapper"
          install -m 0755 "$wrapper/gradlew" gradlew
          install -m 0644 "$wrapper/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" == 3 ]]; then
              exit "$status"
            fi
            printf 'Gradle 发行包准备失败，5 秒后重试（%s/3）\n' "$attempt" >&2
            sleep 5
          done
      - name: 还原 Android 签名文件
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 scripts/release/platforms/materials.py android
      - name: 构建并检查单架构 APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_TARGET: ${{ matrix.target }}
          ANDROID_ABI: ${{ matrix.abi }}
        run: bash scripts/release/platforms/android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-android-${{ matrix.abi }}
          path: .ubaa_local/release/public/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - &cleanup_signing
        name: 清理签名材料
        if: ${{ always() }}
        shell: bash
        run: rm -rf .ubaa_local/release/signing .ubaa_local/release/apple_api
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    if: ${{ !cancelled() && needs.ready.result == 'success' }}
  linux:
    needs:
      - metadata
      - ready
    runs-on: ${{ matrix.os }}
    environment: release-production
    timeout-minutes: 180
    env: *release_env
    steps:
      - *checkout
      - *toolchain
      - name: 准备 Linux 依赖
        run: sudo apt-get update --error-on=any && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - *flutter
      - name: 构建 Linux 发布包
        shell: bash
        run: |-
          just flutter-build platform=linux mode=release
          bash scripts/release/verify-flutter-artifact.sh linux "apps/ubaa_flutter/build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p .ubaa_local/release/public
          tar -czf ".ubaa_local/release/public/UBAA-${RELEASE_VERSION}-linux-${{ matrix.arch }}.tar.gz" -C "apps/ubaa_flutter/build/linux/${{ matrix.arch }}/release" bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-linux-${{ matrix.arch }}
          path: .ubaa_local/release/public/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    if: ${{ !cancelled() && needs.ready.result == 'success' }}
  windows:
    needs:
      - metadata
      - ready
    runs-on: windows-2025
    environment: release-production
    timeout-minutes: 180
    env: *release_env
    steps:
      - *checkout
      - *toolchain
      - *flutter
      - name: 构建 Windows 发布包
        shell: bash
        run: |-
          just flutter-build platform=windows mode=release
          bash scripts/release/verify-flutter-artifact.sh windows apps/ubaa_flutter/build/windows/x64/runner/Release
      - name: 生成 EXE 安装器
        shell: pwsh
        run: |-
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:RELEASE_VERSION" scripts/release/platforms/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-windows-x64
          path: .ubaa_local/release/public/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
    if: ${{ !cancelled() && needs.ready.result == 'success' }}
  macos:
    needs:
      - metadata
      - ready
    runs-on: ${{ inputs.local_macos && 'ubaa-release-macos' || matrix.os }}
    environment: release-production
    timeout-minutes: 180
    env: *release_env
    steps:
      - *checkout
      - *toolchain
      - *flutter
      - name: 准备 Developer ID 签名
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 scripts/release/platforms/apple_signing.py macos
      - name: 构建、签名和公证 macOS
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: bash scripts/release/platforms/macos.sh
      - name: 保存 macOS 公证状态
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-${{ matrix.arch }}
          path: .ubaa_local/release/macos/*.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-macos-${{ matrix.arch }}
          path: .ubaa_local/release/public/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: 清理 Apple 身份
        if: ${{ always() }}
        run: python3 scripts/release/platforms/apple_signing.py cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
    if: ${{ !cancelled() && needs.ready.result == 'success' }}
  ios:
    needs:
      - metadata
      - ready
    runs-on: ${{ inputs.local_macos && 'ubaa-release-macos' || 'xcode-27' }}
    environment: release-production
    timeout-minutes: 180
    env: *release_env
    steps:
      - *checkout
      - *toolchain
      - *flutter
      - name: 准备 App Store 签名
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/release/platforms/apple_signing.py ios
      - &select_xcode
        name: 选择 iOS 固定 Xcode
        shell: bash
        run: |
          source scripts/tools/versions.env
          developer_dir="/Applications/Xcode_${XCODE_IOS_VERSION}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            developer_dir=$(xcode-select -p)
          fi
          export DEVELOPER_DIR="$developer_dir"
          [[ "$(xcodebuild -version | head -n 1)" == "Xcode $XCODE_IOS_VERSION" ]] || exit 1
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: 归档并导出 IPA
        run: bash scripts/release/platforms/ios.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-ios
          path: .ubaa_local/release/store/*.ipa
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: 清理 Apple 身份
        if: ${{ always() }}
        run: python3 scripts/release/platforms/apple_signing.py cleanup
    if: ${{ !cancelled() && needs.ready.result == 'success' }}
  ohos:
    needs:
      - metadata
      - ready
    runs-on: ubuntu-24.04
    environment: release-production
    timeout-minutes: 180
    env: *release_env
    steps:
      - *checkout
      - *toolchain
      - &versions
        id: versions
        uses: ./.github/actions/versions
      - &setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: 准备 HarmonyOS 托管环境
        shell: bash
        run: |-
          sudo apt-get update --error-on=any && sudo apt-get install -y libgl1 libglu1-mesa libgtk-3-dev libsecret-1-dev ninja-build cmake unzip zip
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          bash scripts/bootstrap/ohos.sh
      - *flutter
      - name: 准备发布许可材料
        shell: bash
        run: |-
          just refs-bootstrap
          just quality-tools-bootstrap
          just flutter-dependencies
          (cd apps/ubaa_ohos && just flutter-ohos pub get --enforce-lockfile)
          (cd packages/ubaa_bindings/cargokit/build_tool && just dart pub get --enforce-lockfile)
          just release-preflight "$GITHUB_WORKSPACE/.ubaa_local/release/licenses"
          mkdir -p .ubaa_local/release/public
          (cd .ubaa_local/release/licenses && zip -qr ../public/licenses.zip .)
      - name: 保存发布许可材料
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-materials
          path: .ubaa_local/release/licenses
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
      - name: 还原 HarmonyOS 签名文件
        env:
          OHOS_KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
          OHOS_CERTIFICATE_BASE64: ${{ secrets.OHOS_CERTIFICATE_BASE64 }}
          OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
        run: python3 scripts/release/platforms/materials.py ohos
      - name: 构建 HarmonyOS 商店包
        env:
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          UBAA_DISTRIBUTION_CHANNEL: app_gallery
        run: |-
          bash scripts/release/platforms/ohos.sh
          cp .ubaa_local/release/store/*.app .ubaa_local/release/public/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-harmonyos-arm64
          path: .ubaa_local/release/public/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-harmonyos
          path: .ubaa_local/release/store/*.app
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - *cleanup_signing
    if: ${{ !cancelled() && needs.ready.result == 'success' }}
  distribute:
    needs:
      - metadata
      - android
      - linux
      - windows
      - macos
      - ios
      - ohos
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_BUILD: ${{ needs.metadata.outputs.build }}
      UBAA_APP_SERVICE_URL: ${{ vars.UBAA_APP_SERVICE_URL }}
      UBAA_DISTRIBUTION_CHANNEL: github
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: public-*
          merge-multiple: true
          path: .ubaa_local/release/public
      - name: 准备 GitHub Release 草稿并分发 R2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: python3 scripts/release/distribute.py
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
  app-store:
    needs:
      - metadata
      - ios
    runs-on: ${{ inputs.local_macos && 'ubaa-release-macos' || 'xcode-27' }}
    environment: release-production
    timeout-minutes: 90
    env: *release_env
    steps:
      - *checkout
      - *select_xcode
      - *versions
      - *setup_node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-ios
          path: .ubaa_local/release/store
      - name: 上传并等待 Apple 处理
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: node scripts/release/stores/apple.mjs upload ".ubaa_local/release/store/UBAA-${RELEASE_VERSION}-ios-arm64.ipa"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-store-result
          path: .ubaa_local/appstore_result.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - *cleanup_signing
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
  appgallery:
    needs:
      - metadata
      - ohos
    runs-on: ubuntu-latest
    environment: release-production
    timeout-minutes: 90
    env: *release_env
    steps:
      - *checkout
      - *versions
      - *setup_node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-harmonyos
          path: .ubaa_local/release/store
      - name: 上传并等待 AppGallery 处理
        env:
          APPGALLERY_APP_ID: ${{ secrets.APPGALLERY_APP_ID }}
          APPGALLERY_SERVICE_ACCOUNT_JSON: ${{ secrets.APPGALLERY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/release/stores/huawei.mjs upload ".ubaa_local/release/store/UBAA-${RELEASE_VERSION}-harmonyos-arm64.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appgallery-result
          path: .ubaa_local/appgallery_result.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
    if: ${{ !cancelled() && needs.ohos.result == 'success' }}
  store-access:
    needs: metadata
    runs-on: ${{ inputs.local_macos && 'ubaa-release-macos' || 'macos-26' }}
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        uses: ./.github/actions/versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: 核对商店和公证权限
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPGALLERY_APP_ID: ${{ secrets.APPGALLERY_APP_ID }}
          APPGALLERY_SERVICE_ACCOUNT_JSON: ${{ secrets.APPGALLERY_SERVICE_ACCOUNT_JSON }}
        run: |-
          node scripts/release/stores/apple.mjs probe
          node scripts/release/stores/huawei.mjs probe
      - name: 清理上传密钥
        if: ${{ always() }}
        run: rm -rf .ubaa_local/release/apple_api
  acceptance:
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.acceptance.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/acceptance.py reuse
  ready:
    needs:
      - metadata
      - store-access
      - acceptance
      - verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 核对发布验收来源
        env:
          NEEDS: ${{ toJSON(needs) }}
          REUSED: ${{ needs.acceptance.outputs.reused }}
        run: python3 scripts/release/acceptance.py ready

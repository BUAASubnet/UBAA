name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@just
      - run: just refs
      - run: just check-sensitive
      - run: just check

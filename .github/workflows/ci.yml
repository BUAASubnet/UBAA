name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@just
      - run: just refs
      - run: just check-sensitive
      - run: just check
      - name: 生成无签名 RC 前置报告
        run: just release-preflight "$RUNNER_TEMP/ubaa-release-report"
      - name: 保存无签名 RC 前置报告
        uses: actions/upload-artifact@v6
        with:
          name: ubaa-release-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ubaa-release-report
          if-no-files-found: error
          retention-days: 14

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps

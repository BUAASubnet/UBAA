name: 合并验收
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      local_macos:
        description: Release 使用本机 Apple runner
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      codegen: ${{ steps.plan.outputs.codegen }}
      flutter: ${{ steps.plan.outputs.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check/ci/plan.py plan

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/shellcheck
      - name: 准备冻结引用与脚本工具
        run: |
          just refs-bootstrap
          just quality-tools-bootstrap
      - name: 通用脚本、格式、文档和敏感材料检查
        run: |
          just refs
          just check-sensitive
          just script-check
          cargo fmt --all -- --check

  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ inputs.local_macos && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow == 'Release 构建与草稿' && (matrix.os == 'macos-26' || matrix.os == 'xcode-27') && 'ubaa-release-macos' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/rust_cache
        with:
          kind: checks
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: 默认 feature 与测试注入边界
        shell: bash
        run: |
          cargo check --locked -p ubaa-core --no-default-features --all-targets
          cargo test --locked -p ubaa-core --no-default-features --doc
          bash scripts/tests/facade-test-contract.sh
      - name: 生成公共 Rust 文档
        if: runner.os == 'Linux'
        run: cargo doc --locked --workspace --no-deps

  rust-builds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ inputs.local_macos && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow == 'Release 构建与草稿' && (matrix.os == 'macos-26' || matrix.os == 'xcode-27') && 'ubaa-release-macos' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/rust_cache
        with:
          kind: production
      - name: 构建默认 feature 的两个生产宿主
        # 明确包列表排除测试辅助 crate，两个宿主复用相同的生产依赖编译结果。
        run: cargo build --locked -p ubaa-core-live -p ubaa_flutter_bridge

  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ inputs.local_macos && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow == 'Release 构建与草稿' && (matrix.os == 'macos-26' || matrix.os == 'xcode-27') && 'ubaa-release-macos' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/rust_cache
        with:
          kind: tests
      - name: Core 与其余工作区完整测试
        shell: bash
        run: |
          cargo test --locked -p ubaa-core --features test-contract --all-targets
          cargo test --locked --workspace --exclude ubaa-core --all-targets
          cargo test --locked --workspace --exclude ubaa-core --doc

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - id: tools
        run: |
          source scripts/tools/versions.env
          printf 'deny=%s\n' "$CARGO_DENY_VERSION" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@${{ steps.tools.outputs.deny }}
      - run: cargo fetch --locked
      - run: just dependency-audit

  codegen:
    needs: plan
    if: needs.plan.outputs.codegen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/rust_cache
        with:
          kind: codegen
      - uses: ./.github/actions/flutter
      - id: tools
        shell: bash
        run: |
          source scripts/tools/versions.env
          printf 'expand=%s\nfrb=%s\nrust=%s\n' "$CARGO_EXPAND_VERSION" "$FRB_VERSION" "$RUST_VERSION" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-expand@${{ steps.tools.outputs.expand }}
      - id: frb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ubaa_local/ci_tools/frb
          key: frb-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.frb }}
      - name: 准备固定 FRB codegen
        shell: bash
        run: |
          source scripts/tools/versions.env
          root="$GITHUB_WORKSPACE/.ubaa_local/ci_tools/frb"
          if [[ ! -x "$root/bin/flutter_rust_bridge_codegen" ]]; then
            cargo install --locked flutter_rust_bridge_codegen --version "=$FRB_VERSION" --root "$root"
          fi
          test "$("$root/bin/flutter_rust_bridge_codegen" --version)" = "flutter_rust_bridge_codegen $FRB_VERSION"
          printf 'UBAA_FRB_CODEGEN=%s/bin/flutter_rust_bridge_codegen\n' "$root" >> "$GITHUB_ENV"
      - run: just flutter-dependencies
      - name: 检查 FRB 生成零漂移
        env:
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 1
        run: just flutter-codegen-check

  flutter-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          rust: false
      - uses: ./.github/actions/flutter
      - name: 全工作区统一格式和静态分析
        run: bash scripts/check/flutter-workspace.sh analyze

  flutter-tests:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.flutter) }}
    runs-on: ${{ inputs.local_macos && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow == 'Release 构建与草稿' && (matrix.os == 'macos-26' || matrix.os == 'xcode-27') && 'ubaa-release-macos' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          rust: false
      - uses: ./.github/actions/flutter
      - run: just flutter-dependencies
      - name: 运行完整测试分组
        run: python3 scripts/check/ci/plan.py test "${{ matrix.package }}" "${{ matrix.group }}"
      - name: 保存失败的脱敏视觉差异
        if: failure() && matrix.group == 'golden'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubaa-flutter-golden-diffs-${{ github.run_id }}
          path: packages/ubaa_ui/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 14

  app-service-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          rust: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/app_service/package-lock.json
      - name: 校验应用服务发布内容与发布边界
        run: just app-service-content-check
      - name: 检查 Worker 部署触发条件与发布顺序
        run: node --test scripts/tests/app_service/deploy_workflow_test.mjs
      - name: 检查工作流触发条件和合并门禁
        run: node --test scripts/tests/checks/ci_workflows_test.mjs
      - name: 构建文档站并检查链接
        run: npm run docs:build
      - name: 检查应用服务合同与本地 Worker
        run: just app-service-check

  native:
    uses: ./.github/workflows/flutter-platforms.yml
    with:
      local_macos: ${{ inputs.local_macos || false }}

  main-required:
    name: main-required
    if: ${{ always() }}
    needs: [plan, scripts, rust-checks, rust-builds, rust-tests, dependency-audit, codegen, flutter-analysis, flutter-tests, app-service-contracts, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 确认全部验收成功
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODEGEN_REQUIRED: ${{ needs.plan.outputs.codegen }}
        run: python3 scripts/check/ci/plan.py gate
      - name: 记录实际验收候选
        run: python3 scripts/release/acceptance.py record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-acceptance
          path: .ubaa_local/ci/acceptance.json
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 90

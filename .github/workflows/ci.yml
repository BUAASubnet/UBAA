name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # 同一分支的 push 依次执行，后续 push 不会中断已开始的迁移与部署。
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/toolchain

      - name: 安装固定 ShellCheck
        shell: bash
        run: |
          source scripts/tools/versions.env
          shellcheck_version=$SHELLCHECK_VERSION
          archive="$RUNNER_TEMP/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          bin_dir="$RUNNER_TEMP/shellcheck-bin"
          curl --retry 4 --retry-delay 3 --retry-max-time 120 -fsSLo "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' \
            "$SHELLCHECK_LINUX_SHA256" \
            "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v${shellcheck_version}/shellcheck" \
            "$bin_dir/shellcheck"
          test "$("$bin_dir/shellcheck" --version | awk '/^version:/ { print $2 }')" = "$shellcheck_version"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: 安装固定官方 Flutter SDK
        shell: bash
        run: bash scripts/bootstrap/flutter.sh

      - name: 安装固定 FRB codegen
        shell: bash
        run: |
          source scripts/tools/versions.env
          cargo install --locked cargo-expand --version "=$CARGO_EXPAND_VERSION"
          test "$(cargo-expand --version)" = "cargo-expand $CARGO_EXPAND_VERSION"
          cargo install --locked flutter_rust_bridge_codegen --version "=$FRB_VERSION"
          codegen=$(command -v flutter_rust_bridge_codegen)
          test "$("$codegen" --version)" = "flutter_rust_bridge_codegen $FRB_VERSION"
          printf 'UBAA_FRB_CODEGEN=%s\n' "$codegen" >> "$GITHUB_ENV"

      - name: 建立缺失的冻结引用
        run: just refs-bootstrap
      - name: 纯校验冻结引用
        run: just refs
      - name: 准备固定发布材料开发工具
        run: just quality-tools-bootstrap
      - name: 安装固定 cargo-deny
        shell: bash
        run: |
          source scripts/tools/versions.env
          cargo install --locked cargo-deny --version "=$CARGO_DENY_VERSION"
          test "$(cargo-deny --version)" = "cargo-deny $CARGO_DENY_VERSION"
      - name: 显式预取所有目标的锁定 Cargo 依赖
        run: cargo fetch --locked
      - name: 运行 scripts/release/dependency-audit.sh 显式联网审计
        run: just dependency-audit
      - name: 扫描敏感材料
        run: just check-sensitive
      - name: 运行严格 Rust 与 Shell 确定性门禁
        run: just check-strict
      - name: 准备 FRB 与许可材料所需的锁定 Dart 依赖
        run: just flutter-dependencies
      - name: 检查 FRB 生成零漂移
        env:
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 1
        run: just flutter-codegen-check

  app-service-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: versions
        uses: ./.github/actions/versions
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: just@${{ steps.versions.outputs.just }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/app_service/package-lock.json
      - name: 校验应用服务发布内容与发布边界
        run: just app-service-content-check
      - name: 检查 Worker 部署触发条件与发布顺序
        run: node --test scripts/tests/app_service/deploy_workflow_test.mjs
      - name: 检查应用服务合同与本地 Worker
        run: just app-service-check

  flutter-contracts:
    # 既有 golden 使用 macOS 渲染；完整测试固定同类宿主，保持逐像素比较。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/toolchain
      - name: 安装固定官方 Flutter SDK
        shell: bash
        run: bash scripts/bootstrap/flutter.sh

      - name: 检查完整 Flutter 工作区与原始视觉基线
        run: just flutter-check
      - name: 保存失败的脱敏视觉差异
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubaa-flutter-golden-diffs-${{ github.run_id }}
          path: packages/ubaa_ui/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 14

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: 跨平台 Core 默认与 test-contract 合同
        shell: bash
        run: just core-test-contract
      - run: cargo test --locked --workspace --exclude ubaa-core --all-targets
      - run: cargo build --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps

  app-service-deploy:
    name: 部署应用服务并发布内容
    needs: [contract-gates, app-service-contracts, flutter-contracts, rust-platforms]
    if: >-
      success() && github.event_name == 'push' && github.event.deleted == false
      && github.repository == 'BUAASubnet/UBAA' && vars.APP_SERVICE_DEPLOY_BRANCH != ''
      && github.ref_name == vars.APP_SERVICE_DEPLOY_BRANCH
    runs-on: ubuntu-latest
    environment: app-service-production
    concurrency:
      group: app-service-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: versions
        uses: ./.github/actions/versions
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: just@${{ steps.versions.outputs.just }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/app_service/package-lock.json
      - name: 安装锁定的发布工具依赖
        run: |
          npm ci --no-audit --no-fund
          npm --prefix services/app_service ci --no-audit --no-fund
      - name: 核对候选提交仍是部署分支的最新提交
        id: candidate
        shell: bash
        run: |
          branch_head=$(git ls-remote --exit-code --refs origin "$GITHUB_REF")
          if [[ "${branch_head%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' '部署分支已有更新的提交，跳过本次部署。'
          fi
      - name: 迁移 D1、部署 Worker 并同步公告和渠道配置
        if: steps.candidate.outputs.deploy == 'true'
        shell: bash
        env:
          UBAA_APP_SERVICE_ACCOUNT_ID: ${{ vars.UBAA_APP_SERVICE_ACCOUNT_ID }}
          UBAA_APP_SERVICE_WORKER_NAME: ${{ vars.UBAA_APP_SERVICE_WORKER_NAME }}
          UBAA_APP_SERVICE_D1_ID: ${{ vars.UBAA_APP_SERVICE_D1_ID }}
          UBAA_APP_SERVICE_KV_NAMESPACE_ID: ${{ vars.UBAA_APP_SERVICE_KV_NAMESPACE_ID }}
          UBAA_APP_SERVICE_DOMAIN: ${{ vars.UBAA_APP_SERVICE_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          just app-service-deploy
          just app-service-publish

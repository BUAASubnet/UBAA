name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@just

      - name: 安装固定 ShellCheck
        shell: bash
        run: |
          shellcheck_version=0.11.0
          archive="$RUNNER_TEMP/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          bin_dir="$RUNNER_TEMP/shellcheck-bin"
          curl -fsSLo "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/shellcheck-v${shellcheck_version}/shellcheck" \
            "$bin_dir/shellcheck"
          test "$("$bin_dir/shellcheck" --version | awk '/^version:/ { print $2 }')" = "$shellcheck_version"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: 安装固定官方 Flutter SDK
        shell: bash
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth=1 origin refs/tags/3.41.9:refs/tags/3.41.9
          git -C "$flutter_root" checkout --detach 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
          printf 'UBAA_FLUTTER_HOME=%s\n' "$flutter_root" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$flutter_root" >> "$GITHUB_PATH"
          export UBAA_FLUTTER_HOME="$flutter_root"
          bash ./scripts/check/flutter-toolchains.sh official

      - name: 安装固定 FRB codegen
        shell: bash
        run: |
          cargo install --locked cargo-expand --version '=1.0.126'
          test "$(cargo-expand --version)" = 'cargo-expand 1.0.126'
          cargo install --locked flutter_rust_bridge_codegen --version '=2.13.0'
          codegen=$(command -v flutter_rust_bridge_codegen)
          test "$("$codegen" --version)" = 'flutter_rust_bridge_codegen 2.13.0'
          printf 'UBAA_FRB_CODEGEN=%s\n' "$codegen" >> "$GITHUB_ENV"

      - name: 建立缺失的冻结引用
        run: just refs-bootstrap
      - name: 纯校验冻结引用
        run: just refs
      - name: 检查代码与目录布局
        run: just layout-check
      - name: 扫描敏感材料
        run: just check-sensitive
      - name: 运行 Rust 与 Shell 确定性门禁
        run: just check
      - name: 安装 FRB 生成所需的锁定 Dart 依赖
        working-directory: packages/ubaa_bindings
        run: flutter pub get --enforce-lockfile
      - name: 检查 FRB 生成零漂移
        env:
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 1
        run: just flutter-codegen-check
      - name: 生成无签名 RC 前置报告
        run: just release-preflight "$RUNNER_TEMP/ubaa-release-report"
      - name: 保存无签名 RC 前置报告
        uses: actions/upload-artifact@v6
        with:
          name: ubaa-release-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ubaa-release-report
          if-no-files-found: error
          retention-days: 14

  flutter-contracts:
    # 既有 golden 使用 macOS 渲染；完整测试固定同类宿主，保持逐像素比较。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@just
      - name: 安装固定官方 Flutter SDK
        shell: bash
        run: |
          flutter_root="$RUNNER_TEMP/flutter"
          git init "$flutter_root"
          git -C "$flutter_root" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_root" fetch --depth=1 origin refs/tags/3.41.9:refs/tags/3.41.9
          git -C "$flutter_root" checkout --detach 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
          printf 'UBAA_FLUTTER_HOME=%s\n' "$flutter_root" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$flutter_root" >> "$GITHUB_PATH"
          export UBAA_FLUTTER_HOME="$flutter_root"
          bash ./scripts/check/flutter-toolchains.sh official
      - name: 检查完整 Flutter 工作区与原始视觉基线
        run: just flutter-check
      - name: 保存失败的脱敏视觉差异
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ubaa-flutter-golden-diffs-${{ github.run_id }}
          path: packages/ubaa_ui/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 14

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps

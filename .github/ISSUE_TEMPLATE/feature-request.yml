name: 功能建议
description: 记录使用场景和改进建议
body:
  - type: markdown
    attributes:
      value: |
        **UBAA 当前处于功能冻结期。建议会被记录，但暂不实施。**
        Issue 公开可见，请勿粘贴账号、密码、Cookie、Token 或截图中的个人信息。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想完成什么？目前在哪里遇到困难？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的改进
      description: 请说明希望 UBAA 如何帮助你完成这件事。
    validations:
      required: true

[package]
name = "ubaa-cli"
description = "Command-line host for UBAA Core"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive"] }
directories = "6.0.0"
rpassword = "7.4.0"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
ubaa-core = { path = "../../crates/ubaa-core" }

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }

[[bin]]
name = "ubaa"
path = "src/main.rs"

[lints]
workspace = true

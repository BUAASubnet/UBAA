[package]
name = "ubaa-cli"
autobins = false
description = "Command-line host for UBAA Core"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
clap.workspace = true
directories.workspace = true
fs2.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
rpassword.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ubaa-core = { path = "../../crates/ubaa_core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }

[dev-dependencies]
jsonschema.workspace = true
ubaa-test-support = { path = "../../crates/ubaa_test_support" }

[[bin]]
name = "ubaa"
path = "src/main.rs"

[[bin]]
name = "core-live"
path = "src/bin/core_live/main.rs"

[lints]
workspace = true

publish_to: 'none'
resolution: workspace
version: 2.0.0+2006

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter_rust_bridge: 2.13.0
  flutter:
    sdk: flutter
  ubaa_app:

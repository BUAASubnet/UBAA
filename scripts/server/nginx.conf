map $http_upgrade $ubaa_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 10443 ssl default_server;
    listen [::]:10443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/ssl/ubaa.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ubaa.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    location = /healthz { return 200 'ok\n'; }
    location / { return 404; }
}
server {
    listen 10443 ssl;
    listen [::]:10443 ssl;
    http2 on;
    server_name app.ubaa.top;
    error_log /dev/null crit;
    ssl_certificate /etc/nginx/ssl/ubaa.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ubaa.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
server {
    listen 10443 ssl;
    listen [::]:10443 ssl;
    http2 on;
    server_name www.ubaa.top;
    ssl_certificate /etc/nginx/ssl/ubaa.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ubaa.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    root /srv/ubaa/docs/current;
    location ~ ^/(downloads/|release-data.json$) {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control no-store always;
    }
    location /assets/ {
        alias /srv/ubaa/docs/assets/;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control 'public, max-age=300';
    }
}
server {
    listen 10443 ssl;
    listen [::]:10443 ssl;
    http2 on;
    server_name download.ubaa.top;
    ssl_certificate /etc/nginx/ssl/ubaa.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ubaa.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    root /srv/ubaa/downloads;
    location /releases/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header Content-Disposition attachment;
    }
    location / { return 404; }
}
server {
    listen 10443 ssl;
    listen [::]:10443 ssl;
    http2 on;
    server_name stats.ubaa.top;
    ssl_certificate /etc/nginx/ssl/ubaa.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ubaa.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ubaa_connection_upgrade;
    }
}

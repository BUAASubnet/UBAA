[package]
name = "ubaa-core"
description = "Platform-independent UBAA authentication and campus-service core"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1.89"
aes = "0.8.4"
base64 = "0.22.1"
cipher = { version = "0.4.4", features = ["block-padding"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
httpdate = "1.0.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10.6"
regex = "1.12.2"
rand = "0.8.5"
reqwest = "0.13.1"
rsa = "0.9.8"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
url = "2.5.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints]
workspace = true

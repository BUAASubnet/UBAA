[package]
name = "ubaa-core"
description = "Platform-independent UBAA authentication and campus-service core"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
test-contract = []

[dependencies]
async-trait = "0.1.89"
aes = "0.8.4"
base64 = "0.22.1"
cipher = { version = "0.4.4", features = ["block-padding"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
httpdate = "1.0.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10.6"
regex = "1.12.2"
rand = "0.8.5"
reqwest = "0.13.1"
rsa = "0.9.8"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
url = "2.5.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[[test]]
name = "bykc"
path = "tests/bykc.rs"
required-features = ["test-contract"]

[[test]]
name = "cgyy"
path = "tests/cgyy.rs"
required-features = ["test-contract"]

[[test]]
name = "config_security"
path = "tests/config_security.rs"
required-features = ["test-contract"]

[[test]]
name = "connection"
path = "tests/connection.rs"
required-features = ["test-contract"]

[[test]]
name = "contracts"
path = "tests/contracts.rs"
required-features = ["test-contract"]

[[test]]
name = "evaluation"
path = "tests/evaluation.rs"
required-features = ["test-contract"]

[[test]]
name = "facade"
path = "tests/facade.rs"
required-features = ["test-contract"]

[[test]]
name = "libbook"
path = "tests/libbook.rs"
required-features = ["test-contract"]

[[test]]
name = "route_matrix"
path = "tests/route_matrix.rs"
required-features = ["test-contract"]

[[test]]
name = "route_policy"
path = "tests/route_policy.rs"
required-features = ["test-contract"]

[[test]]
name = "session"
path = "tests/session.rs"
required-features = ["test-contract"]

[[test]]
name = "signin"
path = "tests/signin.rs"
required-features = ["test-contract"]

[[test]]
name = "ygdk"
path = "tests/ygdk.rs"
required-features = ["test-contract"]

[lints]
workspace = true

[package]
name = "ubaa-core"
description = "Platform-independent UBAA authentication and campus-service core"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
test-contract = []

[dependencies]
async-trait.workspace = true
aes.workspace = true
base64.workspace = true
cipher.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cookie_store.workspace = true
cbc.workspace = true
cfb-mode.workspace = true
ecb.workspace = true
hex.workspace = true
image.workspace = true
md-5.workspace = true
regex = "1.12.2"
rand.workspace = true
reqwest.workspace = true
rsa.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha1.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
rusqlite.workspace = true
aes-gcm.workspace = true
hmac.workspace = true
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "android")'.dependencies]
fs2.workspace = true

[[test]]
name = "bykc"
path = "tests/bykc.rs"
required-features = ["test-contract"]

[[test]]
name = "cgyy"
path = "tests/cgyy.rs"
required-features = ["test-contract"]

[[test]]
name = "config_security"
path = "tests/config_security.rs"
required-features = ["test-contract"]

[[test]]
name = "connection"
path = "tests/connection.rs"
required-features = ["test-contract"]

[[test]]
name = "contracts"
path = "tests/contracts.rs"
required-features = ["test-contract"]

[[test]]
name = "evaluation"
path = "tests/evaluation.rs"
required-features = ["test-contract"]

[[test]]
name = "facade"
path = "tests/facade.rs"
required-features = ["test-contract"]

[[test]]
name = "libbook"
path = "tests/libbook.rs"
required-features = ["test-contract"]

[[test]]
name = "interactive_auth"
path = "tests/interactive_auth.rs"
required-features = ["test-contract"]

[[test]]
name = "route_matrix"
path = "tests/route_matrix.rs"
required-features = ["test-contract"]

[[test]]
name = "route_policy"
path = "tests/route_policy.rs"
required-features = ["test-contract"]

[[test]]
name = "session"
path = "tests/session.rs"
required-features = ["test-contract"]

[[test]]
name = "signin"
path = "tests/signin.rs"
required-features = ["test-contract"]

[[test]]
name = "ygdk"
path = "tests/ygdk.rs"
required-features = ["test-contract"]

[lints]
workspace = true

[dev-dependencies]
flate2.workspace = true

[package]
name = "ubaa-test-support"
description = "Shared, sanitized test support for UBAA workspace crates"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1.89"
ubaa-core = { path = "../ubaa-core", features = ["test-contract"] }

[dev-dependencies]
aes = "0.8.4"
base64 = "0.22.1"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
url = "2.5.7"

[lints]
workspace = true

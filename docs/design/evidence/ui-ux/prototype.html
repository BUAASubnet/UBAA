<script>
const css = `

ound:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:48px}textarea{resize:vertical;min-height:112px}.table{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}.grade-row{display:grid;grid-template-columns:minmax(170px,1fr) 100px 90px 90px;align-items:center;gap:16px;padding:19px 24px;border-bottom:1px solid var(--line)}.grade-row:last-child{border:0}.grade-row.header{background:var(--soft);color:var(--muted);font-size:.86em;padding-top:12px;padding-bottom:12px}.score{font-size:1.5em;font-weight:650;color:var(--blue)}.grade-row small{display:block}.list-detail{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px}.list-item{width:100%;text-align:left;padding:20px;border-bottom:1px solid var(--line);border-radius:0}.list-item.active{background:var(--tint)}.subtle-box{background:var(--soft);border-radius:12px;padding:16px}.divider{height:1px;background:var(--line);margin:24px 0}.seat-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.seat{border:1px solid var(--line);text-align:left;background:var(--surface)}.seat strong,.seat small{display:block}.seat.selected{border:2px solid var(--blue);background:var(--tint)}.seat:disabled{color:var(--muted);cursor:default}.callout{display:flex;gap:12px;padding:16px;background:var(--warnbg);color:var(--warn);border-radius:12px}.callout p{font-size:.93em}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:24px}.narrow{max-width:760px;margin:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full{grid-column:1/-1}.steps{display:flex;gap:16px;color:var(--muted);margin-bottom:24px;font-size:.86em}.steps strong{color:var(--blue)}.summary-line{display:flex;justify-content:space-between;gap:20px;margin-top:16px}.summary-line span:first-child{color:var(--muted)}.summary-line strong{text-align:right}.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.avatar{width:64px;height:64px;border-radius:20px;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-size:24px}.login{max-width:440px;margin:48px auto}.login .brand{padding:0 0 24px}.login label{margin-top:20px}.login button.primary{width:100%;margin-top:28px}.check{display:flex;align-items:center;gap:10px;font-size:.93em}.check input{width:18px;min-height:18px;accent-color:var(--blue)}.result-icon{width:56px;height:56px;display:grid;place-items:center;background:var(--warnbg);color:var(--warn);font-size:30px;border-radius:18px;margin-bottom:20px}.bottomnote{font-size:.8em;color:var(--muted);margin-top:24px}.progress{height:5px;border-radius:5px;background:var(--soft);margin:14px 0}.progress span{display:block;background:var(--blue);height:100%;width:40%;border-radius:5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:12px;padding:14px 20px;max-width:85%;z-index:10}.only-mobile{display:none}

@media(max-width:599px){.app{flex-direction:column}.nav{order:2;width:100%;height:76px;padding:4px 8px;flex-direction:row;gap:0;border-right:0;border-top:1px solid var(--line)}.nav .brand{display:none}.nav button{flex:1;padding:8px 4px;border-radius:12px}.workspace{min-height:0}.notice{padding:7px 16px;font-size:10px}main{padding:24px 16px}.heading{margin-bottom:24px;align-items:flex-start}.heading>.secondary{padding:10px;min-width:48px}.heading .button-label{display:none}.two,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.launchers{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.launcher{padding:12px 10px}.launcher small{font-size:11px}.card{padding:20px}.grade-row.header{display:none}.grade-row{grid-template-columns:1fr auto;gap:8px;padding:18px}.grade-row>.credit,.grade-row>.gpa{font-size:.86em;color:var(--muted)}.grade-row>.credit:before{content:'学分 '}.grade-row>.gpa:before{content:'绩点 '}.seat-list{grid-template-columns:repeat(2,minmax(0,1fr))}.actions button{flex:1}.login{margin:24px auto}.only-mobile{display:block}.steps{gap:10px;flex-wrap:wrap}.setting{flex-wrap:wrap}.setting select{max-width:160px}.three{gap:12px}.summary-line{gap:12px}.tabs{gap:4px}.tabs button{padding:8px 12px}}
@media(min-width:600px) and (max-width:999px){.today-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.today-summary>.card:first-child{grid-column:1/-1}}
@media(max-width:599px){
.today-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.today-summary>.card{padding:14px;min-height:110px}
.today-summary>.card:first-child{grid-column:1/-1;min-height:130px;display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center}
.today-summary>.card:first-child>.row{grid-column:2;grid-row:1/3;flex-direction:column;gap:6px;align-items:flex-end}

.today-summary>.card:not(:first-child) .metric{font-size:1.7em}

`;
const btn=(text,scene,cls='secondary')=>`<button class="${cls}" data-go="${scene}">${text}</button>`;
const heading=(eyebrow,title,extra='')=>`<div class="heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1></div>${extra}</div>`;
const field=(label,value,type='text',full='')=>`<label class="field ${full}"><span>${label}</span><input type="${type}" value="${value}"></label>`;
const nav=(active)=>`<nav class="nav"><div class="brand">UBAA</div>${[['◷','今日','today'],['▤','学习','grades'],['⌘','校园','library'],['○','我的','profile']].map(([icon,text,id])=>`<button data-go="${id}" class="${active===id?'active':''}"><span class="icon">${icon}</span><span>${text}</span></button>`).join('')}<div class="nav-foot">校园生活，井然有序。<br>合成数据预览</div></nav>`;
const courses=[['数据结构与算法','专业必修 · CS-DEMO-01','92','4.0','3.8'],['线性代数','学科基础 · MA-DEMO-02','88','3.0','3.5'],['大学物理实验','实验课程 · PH-DEMO-03','95','1.5','4.0'],['离散数学','专业必修 · CS-DEMO-04','90','3.0','3.7'],['大学英语','公共必修 · EN-DEMO-05','86','2.0','3.3'],['工程伦理与科技社会的跨学科思考','通识课程 · GE-DEMO-06','待出','2.0','—']];
const gradeTable=()=>`<div class="table"><div class="grade-row header"><span>课程</span><span>成绩</span><span>学分</span><span>绩点</span></div>${courses.map(c=>`<div class="grade-row"><div><h3>${c[0]}</h3><small>${c[1]}</small></div><span class="${c[2]==='待出'?'badge warn':'score'}">${c[2]}</span><span class="credit">${c[3]}</span><span class="gpa">${c[4]}</span></div>`).join('')}</div>`;
const pages={
today:()=>heading('周二 · 9 月 8 日','下午好，合成同学',`<button class="secondary" data-toast="原型中的合成数据已展示，不发起业务请求">↻ <span class="button-label">刷新概览</span></button>`)+`<div class="grid three today-summary"><section class="card"><p class="muted">今日课程</p><div class="row spread"><strong class="metric">2 <small>门</small></strong><span class="badge">下午 1 门</span></div><p class="muted" style="margin-top:12px">下一节 · 大学物理实验</p><p class="time">14:00 · 合成实验楼 B105</p></section><section class="card"><p class="muted">待完成作业</p><strong class="metric">3 <small>项</small></strong><p style="margin-top:12px">算法复杂度练习</p><p class="muted">9 月 14 日 23:59 截止</p></section><section class="card"><p class="muted">我的预约</p><strong class="metric">1 <small>条</small></strong><p style="margin-top:12px">图书馆 · 二层安静阅览区</p><p class="muted">合成时段 10:00–12:00</p></section></div><section class="section"><h2 class="section-title">常用功能</h2><div class="launchers">${[['◷','课表','查看今日课程','grades'],['▦','考试','时间与考场','grades'],['▥','成绩','课程与学分','grades'],['⌂','空教室','找自习空间','library'],['▤','SPOC','课程作业','grades'],['⌨','希冀','实验与题目','grades'],['◇','教学评教','查看待评课程','grades'],['✧','博雅','探索讲座课程','bykc'],['▱','图书馆','选座与预约','library'],['✓','课堂签到','查看签到状态','error'],['⌘','场馆','预约运动空间','form'],['☀','阳光打卡','项目与记录','error']].map(([i,t,s,g])=>`<button class="launcher" data-go="${g}"><span class="icon">${i}</span><strong>${t}</strong><small>${s}</small></button>`).join('')}</div></section><section class="section card"><div class="row spread"><h2>今日安排</h2>${btn('查看课表 →','grades','link')}</div><div class="class-row"><div class="time">08:00<br><small>09:35</small></div><div><h3>数据结构与算法</h3><p class="muted">合成教学楼 A203 · 示例教师甲</p></div></div><div class="class-row"><div class="time">14:00<br><small>15:35</small></div><div><h3>大学物理实验</h3><p class="muted">合成实验楼 B105 · 示例教师乙</p></div></div></section>`,
login:()=>`<div class="login"><div class="brand">UBAA</div><p class="eyebrow">学习与校园生活，一处掌握</p><h1>欢迎回来</h1><p class="muted" style="margin-top:12px">登录后查看课程、作业与校园预约。</p><div class="card section">${field('学号','2020000099')}${field('密码','synthetic-password','password')}<label class="check"><input type="checkbox" checked>记住密码</label><p class="muted" style="font-size:12px;margin:6px 0 0 28px">通过本机安全存储保存，可随时清除。</p><label class="check"><input type="checkbox">下次自动登录</label>${btn('登录并进入今日','today','primary')}<p class="bottomnote">此处为合成登录交互，不会校验账号或连接学校。</p></div><div class="row spread section"><span class="muted">连接模式 · 自动</span><button class="link" data-toast="原型展示连接设置；生产应用按既有认证路线执行">连接设置</button></div></div>`,
grades:()=>heading('学习 / 成绩','每一份努力，都有记录')+`<div class="tabs"><button class="selected" data-tab>全部成绩</button><button data-tab>已出成绩</button><button data-tab>待出成绩</button></div><div class="filters"><label class="field"><span>学期</span><select><option>2025–2026 学年春季学期</option><option>2026–2027 学年秋季学期</option></select></label><label class="field"><span>搜索当前结果</span><input placeholder="输入课程名称" id="courseSearch"></label><button class="primary" data-toast="已应用合成查询条件">应用筛选</button></div><div class="row spread" style="margin-bottom:16px"><span class="muted">6 门课程 · 5 门已出成绩</span><small>更新于 14:32 · Direct</small></div>${gradeTable()}<p class="bottomnote">成绩、学分与绩点按原始课程结果展示；不根据分数推断课程合格规则。</p>`,

let confirmationKind='library';
let selectedSeat='A018';
let selectedSlot='10:00–12:00';
pages.confirm=()=>{
const venue=confirmationKind==='form', bykc=confirmationKind==='bykc';
const title=bykc?'博雅选课':venue?'场馆预约':'图书馆座位预约';
const place=bykc?'从星空到深空：航天探索':venue?'合成体育馆 · 羽毛球 4 号场':'合成校区图书馆 · 二层安静阅览区';
const date=bykc||venue?'2026 年 9 月 12 日':'2026 年 9 月 8 日';
const slot=bykc?'14:00–16:00':venue?'10:00–11:00':selectedSlot;
return heading('校园 / 核对信息','确认这次'+(bykc?'选课':'预约'))+`<div class="narrow"><section class="card"><div class="row spread"><span class="badge">等待确认</span><small>原型有效时间示例 · 02:45</small></div><h2 style="margin-top:24px">${title}</h2><p class="muted" style="margin-top:8px">${place}</p><div class="divider"></div>${!venue&&!bykc?`<div class="summary-line"><span>座位</span><strong>${selectedSeat}</strong></div>`:''}<div class="summary-line"><span>日期</span><strong>${date}</strong></div><div class="summary-line"><span>时段</span><strong>${slot}</strong></div><div class="summary-line"><span>实际连接</span><strong>Direct</strong></div><div class="callout section"><span>ⓘ</span><p>请核对目标与时段。确认后只提交一次；如果结果不确定，请先读取相关记录，不要重复提交。</p></div><div class="actions">${btn('取消',confirmationKind)}<button class="primary" data-toast="原型已演示单次确认：结果待核对，请先读取相关记录；不向真实业务发送任何请求。">确认提交（仅原型）</button></div><p class="bottomnote">设计原型只演示确认反馈，不发送任何业务写入。完整未知结果画面见顶部“旧数据 / 结果未知”。</p></section></div>`;
};
function render(){const [w,h]=document.querySelector('#size').value.split(',');const scene=document.querySelector('#scene').value;const theme=document.querySelector('#theme').value;const scale=document.querySelector('#scale').value;const frame=document.querySelector('#preview');frame.width=w;frame.height=h;const active=['login','today'].includes(scene)?'today':['grades'].includes(scene)?'grades':scene==='profile'?'profile':'library';frame.srcdoc=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${css}</style><body class="${theme}" style="--scale:${scale}"><div class="app">${scene==='login'?'':nav(active)}<div class="workspace"><div class="notice">设计原型 · 合成数据 · 非实际业务</div><main><div class="content">${pages[scene]()}</div></main></div></div></body></html>`;frame.onload=()=>{const doc=frame.contentDocument;doc.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='confirm')confirmationKind=['form','bykc'].includes(scene)?scene:'library';document.querySelector('#scene').value=b.dataset.go;render()});doc.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>{doc.querySelector('.toast')?.remove();const t=doc.createElement('div');t.className='toast';t.textContent=b.dataset.toast;doc.body.append(t);setTimeout(()=>t.remove(),3500)});doc.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(scene==='library')selectedSlot=b.textContent});doc.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{doc.querySelectorAll('[data-seat]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedSeat=b.querySelector('strong').textContent});const search=doc.querySelector('#courseSearch');if(search)search.oninput=()=>doc.querySelectorAll('.grade-row:not(.header)').forEach(r=>r.style.display=r.textContent.includes(search.value)?'':'none');const inner=doc.querySelector('#innerTheme');if(inner){inner.value=theme;inner.onchange=()=>{document.querySelector('#theme').value=inner.value;doc.body.className=inner.value}}}}
document.querySelectorAll('.controls select').forEach(e=>e.onchange=render);render();
</script></html>
